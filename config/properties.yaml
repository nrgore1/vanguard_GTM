  - id: liqmint
    task_prefix: LQR
    url: https://liqmint.com
    name: LiqMint (R0 retail)
    track: A
    motion: product_led_growth
    lint_profile: institutional
    positioning_status: confirmed
    positioning: >
      The non-custodial safety layer for stablecoins, for retail users. LiqMint
      never holds user funds; it makes stablecoin moves safer, auditable and
      defensible - wallet-transfer safety checks, stablecoin intelligence, a
      Knowledge Center and the Vira assistant. Growth model is a
      content-to-conversion loop: short educational reels -> Knowledge Center
      lesson -> signup -> FIRST COMPLETED SAFETY CHECK (the activation event,
      not signup) -> 7/30-day return.
    not_this: >
      Not a yield product, not a retail DeFi dashboard or yield table, not an
      exchange, not investment advice. Never promise yield or returns; copy is
      educational ("not advice"). Payments are subscription billing only - no
      wallet transfers, deposits or stablecoin purchases through LiqMint.
    capability_facts:
      - "Wallet-transfer safety checks (e.g. five checks before sending USDC, wrong-chain protection, wallet-approval explanations)"
      - "Stablecoin intelligence views, Knowledge Center (/learn) lessons with embedded videos, Vira assistant"
      - "Content Studio publishing pipeline: up to ~50 scheduled reels/month; weekday 10:00 and 16:00 UTC slots"
      - "Funnel instrumentation live: video_view -> lesson_open -> signup -> first_safety_check -> return_visit"
      - "Integration breadth (design scope): 10 native connectors, 700+ wallets via WalletConnect, 25 chains, 25 protocols"
    pricing_facts:
      - "Retail plan: $19.99/month via Stripe (card, Apple Pay) or PayPal; guest and free Basic access exist"
      - "Retail tiers in code: Basic, Individual Investor, Investor Pro"
    icp_seeds:
      - "US retail stablecoin holders (USDC/USDT) moving funds between wallets, exchanges and chains who fear irreversible mistakes"
      - "Crypto-curious professionals who want to learn stablecoin safety before acting"
    partner_seeds: ["wallet providers", "crypto education creators", "exchange learn/education programs", "personal-finance newsletters"]
    channels: [youtube_shorts, instagram_reels, tiktok, x, seo_knowledge_center, email_nurture]
    known_pipeline_context: >
      R0 launch plan: hand-finish 10 flagship reels; three activation hero topics
      (five checks before sending USDC; avoiding wrong-chain mistakes; what wallet
      approvals mean); 3-minute investor demo path on /learn. Partner revenue is
      pipeline only.
