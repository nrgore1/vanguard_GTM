  - id: atmakosh
    task_prefix: ATM
    url: https://atmakosh.com
    name: Atmakosh
    track: C
    motion: product_led_growth
    lint_profile: institutional
    positioning_status: confirmed
    positioning: >
      Governance-as-a-service for AI agents: systems call Atmakosh before they
      act. Powerful, goal-driven agents are governed with structure - plural
      judgment, a declared perimeter, graduated autonomy, human oversight and
      tamper-evident evidence - not with trust. A decision is deliberated by
      eight independent worldviews in four traditions (Vedanta, Jain, Buddhist;
      Nyaya; Stoic, Kantian; Confucian; Management); disagreement is preserved,
      never averaged; a deterministic, deny-wins rule issues the verdict - the
      model only advises. Every decision is hash-chained and replays exactly.
      "Governance is cost discipline": an ungoverned agent is an unbounded
      invoice. Mapped to emerging EU/US/UK/Canada AI-governance obligations;
      Regulation (EU) 2026/1744 deferred Annex III - "the date moved, the work
      didn't."
    not_this: >
      Not a sandbox/isolation product, not an autonomous decision-maker, not an
      investment or financial-advice product. Not "certified compliant" with
      any regulation - mapped to obligations.
    capability_facts:
      - "API: POST /v1/agents/authorize -> verdict, conditions, execute, approval_required, chained audit_id"
      - "Autonomy tiers: shadow (observe-only), human_in_loop (signed admin approval), autonomous"
      - "Five-gate loop: suspension -> circuit breakers -> deny-by-default perimeter -> eight-worldview council -> autonomy tier"
      - "Agents: Veda (governance spine, live); Kairo (governed ops/cost agent, control-plane model shipped)"
      - "Regions live: EU, US, CA, UK; India and Gulf coming soon"
      - "Internal governance benchmark: 20 cases at 100% on schema validity, determinism, replay, disagreement preservation, escalation (internal eval, cite as such)"
    pricing_facts:
