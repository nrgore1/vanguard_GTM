  - id: liqmint-institutional
    task_prefix: LQI
    url: https://institutional.liqmint.com
    name: LiqMint Institutional Edition
    track: A
    motion: high_touch_sales
    lint_profile: institutional
    positioning_status: confirmed
    positioning: >
      Governed AI treasury infrastructure for stablecoin capital: the operating
      system for governed stablecoin treasury management. Every treasury action
      becomes a persisted workflow - proposal, simulation, policy validation,
      approval, settlement verification - and produces an audit-grade Treasury
      Evidence Pack. Non-custodial and customer-signed: LiqMint prepares wallet
      proposals, the customer's wallet stays the signer and custodian. A separate
      institutional product and deployment track (not a Pro-plan extension),
      tenant-scoped, provider-neutral. Customer-facing terms: SMDP Score and
      Allocation Windows.
    not_this: >
      Not a chatbot, not a retail DeFi dashboard, not a yield table, not an
      unmanaged autonomous trading bot, not a single-model AI wrapper. Never
      presented as risk-free, fixed-return, perfectly hedged, guaranteed-yield or
      guaranteed-settlement. Does not pool assets, take discretionary custody,
      receive private keys or execute autonomously. Partner APIs and
      jurisdictional availability are contract-dependent.
    capability_facts:
      - "Institutional package design: 50 stablecoin workflows and 50 enforceable policy templates; policies fail closed when evidence is missing"
      - "Agent templates: allocation, risk_policy, execution, reconciliation, reporting"
      - "Integration adapters available, credentials required before use: Fireblocks, Coinbase Prime, Safe (multisig proposals), Snowflake and Splunk (evidence/telemetry export); Okta SSO/SCIM is a configuration blueprint"
      - "Safe execution: signer verification, owner/threshold enforcement"
      - "Onboarding: NDA and security review -> SSO/RBAC -> 30 days read-only baseline -> customer-approved policy set -> proposal-only integration -> test transaction -> customer finance validates savings"
      - "Provider candidates under diligence (never claim live): Hyperliquid, Open USD (OUSD, distinct from Origin Dollar), Robinhood Chain/APIs, Bitstamp Institutional; Canton: 'fully capable of supporting Canton integration'"
      - "Integration breadth (design scope): 102 networks"
    pricing_facts:
      - "Reference annual package: $175,000 (Institutional Pro/Enterprise); ROI calculator is customer-editable and illustrative, not a guarantee"
    icp_seeds:
      - "Heads of digital assets / treasury at US broker-dealers, banks and asset managers running tokenized Treasuries, repo and stablecoin balances"
      - "Crypto-native funds and corporate treasuries with $50M+ stablecoin balances across several chains and wallets needing segregation of duties and audit evidence"
    partner_seeds: ["qualified custodians and wallet infrastructure (Fireblocks, Coinbase Prime, Safe)", "Big-4 / digital-asset audit practices", "tokenization platforms", "Canton ecosystem participants", "treasury management systems"]
    channels: [linkedin, email_outbound, whitepapers, events]
