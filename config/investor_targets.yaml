# Investor targets for the Vireoka / LiqMint raise (loaded by `vanguard investors import`).
#
# Sources
#  - Attendee lists of the Virtual 1:1 VC Pitch Conf, Sep 17, 2026: the 375-investor pitch list and the full
#    80-page vcconf.com investor export (542 investors). Only investors listing Fintech, Crypto or AI are
#    included (307 across both); fund-of-funds-only LPs are left out.
#  - Three investor speakers from the March 2026 VC Conf transcript whose stated thesis fits LiqMint.
#  - "considerations" come from the March 2026 panels (what early-stage investors said they look for in 2026).
#  - "research" is public-web research on the top 40 + the 3 speakers; every fact has a source URL, and
#    "confidence" says whether the person was confirmed at that firm. No email address is guessed; published_email
#    is only an address the firm itself publishes.
#
# Ranking: likelihood to invest in LiqMint Institutional (pre-revenue B2B governance, risk and audit-evidence
# layer for institutional stablecoin / tokenized-asset operations).
#   score = 20 x (thesis 25% + stage 15% + check 15% + geography 5% + researched fit 40%), each factor 0-5
#   thesis: Fintech 2, Crypto 2.5, AI 1, Cybersecurity/SaaS 0.5 (max 5) · stage: pre-seed + seed 5, seed 4.5,
#   pre-seed 3, Series A only 2 · check: can anchor part of $3M 5 ... <$100K 1 · geography: US 5, global 4
#   researched fit: 0-5 from research, 2 when not researched yet · +3 if in the vcconf top-20 match list or
#   among the 10 most responsive investors (21+ startup calls) · -6 when research could not confirm identity.
#   P0 >= 75, P1 >= 55, else P2.
