# Vanguard-GTM partner playbooks - the "expert" layer for Engine 2B (Partner Outreach).
# ---------------------------------------------------------------------------------
# For every property: which partner categories to pursue, what kind of partnership each
# is, why both sides win, the usual deal structure, where to find the right contact,
# and default scoring factors. The agent (local model or Claude) uses this as grounding
# to name specific organisations; with no model at all, `vanguard partners recommend
# --offline` turns it straight into prioritised segment-level recommendations + drafts.
#
# kinds: design_partner | co_sell | referral_affiliate | distribution | integration
# factors (1-5): fit        - how closely their customers match our ICP
#                reach      - size of the audience/pipeline they can open
#                access     - how reachable (warm path, public contact, small org = easier)
#                strategic  - long-term value (moat, data, credibility, co-selling motion)
#                speed      - how fast a first result is realistic
# Priority score = weighted average (weights below) mapped to 0-100; P0 >= 75, P1 >= 55, else P2.
# Examples are illustrative targets to research - never claim a relationship exists.

scoring:
  weights: {fit: 0.30, reach: 0.25, access: 0.15, strategic: 0.20, speed: 0.10}
  p0_min: 75
  p1_min: 55

message_rules:
  max_steps: 3
  default_delays_days: [0, 4, 9]
  # every sent email gets the compliance footer from outreach.py (sender identity, postal
  # address, opt-out). Templates must never claim customers, partners, users or results.

