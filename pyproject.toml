[project]
name = "vanguard-gtm"
version = "0.8.0"
description = "Vanguard-GTM: parallel go-to-market orchestration for the Vireoka portfolio"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "pydantic>=2.6",
  "httpx>=0.27",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "email-validator>=2",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vanguard = "vanguard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vanguard", "vanguard.web"]
